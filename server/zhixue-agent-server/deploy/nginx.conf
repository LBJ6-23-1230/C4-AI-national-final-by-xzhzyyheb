events { worker_connections 1024; }
http {
  server_tokens off;
  log_format safe '$time_iso8601 $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  upstream backend { server api:8000; }
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"errorCode":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","details":null}';
    }
    location ~ ^/api/v1/auth/(login|register|send-code|verify-code|login-or-register|login-with-huawei)$ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 70s;
      proxy_send_timeout 70s;
    }
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 70s;
      proxy_send_timeout 70s;
    }
  }
}
